<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1976D2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRM PPR">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>CRM PPR</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7fa;font-family:Arial,sans-serif}
#app{width:100%;height:100%;border:0;display:block;background:white}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#f5f7fa;z-index:5;color:#174a7e}
.spinner{width:38px;height:38px;border:4px solid #d7e4f2;border-top-color:#1976D2;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Cargando CRM PPR…</div></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxMAFhYVzXlARYajXOhm_W7Qo4cnk6BwUWU4vUkRqpGU3PbJ8kkgmoH-_bPVkEgV9PjrA/exec" allow="clipboard-read; clipboard-write; camera; microphone"></iframe>
<script>
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loading').style.display='none',900));
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
